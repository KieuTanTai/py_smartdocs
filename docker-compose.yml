services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.local
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend,host.docker.internal
      DB_ENGINE: django.db.backends.sqlite3
      REDIS_ENDPOINT: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://ollama:11434
      TMPDIR: /shared-tmp
      TMP: /shared-tmp
      TEMP: /shared-tmp
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./storage:/app/storage
      - ./backend/metadata:/app/backend/metadata
      - ./docs/logs:/app/docs/logs
      - shared_tmp:/shared-tmp

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.local
      DB_ENGINE: django.db.backends.sqlite3
      REDIS_ENDPOINT: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      OLLAMA_BASE_URL: http://ollama:11434
      TMPDIR: /shared-tmp
      TMP: /shared-tmp
      TEMP: /shared-tmp
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./storage:/app/storage
      - ./backend/metadata:/app/backend/metadata
      - ./docs/logs:/app/docs/logs
      - shared_tmp:/shared-tmp
    command: celery -A app.settings.local:_celery_app worker --loglevel=info

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SMARTDOCS_API_BASE_URL: http://backend:8000
      TMPDIR: /shared-tmp
      TMP: /shared-tmp
      TEMP: /shared-tmp
    depends_on:
      - backend
    ports:
      - "8001:8001"
    volumes:
      - shared_tmp:/shared-tmp

volumes:
  redis_data:
  ollama_data:
  shared_tmp:
